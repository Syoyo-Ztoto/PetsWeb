<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>武汉宠物友好地图</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero" aria-labelledby="page-title">
        <div class="hero__content">
          <p class="eyebrow">Wuhan pet-friendly finder</p>
          <h1 id="page-title">武汉宠物友好地图</h1>
          <p class="hero__summary">
            输入武汉地址，先选择酒店、草坪、公园、商场、餐饮或宠物服务，再查看 20 公里内的具体地点。
          </p>
        </div>
        <form class="search-panel" id="search-form">
          <label for="address">出发地址</label>
          <div class="search-row">
            <input
              id="address"
              name="address"
              type="search"
              value="武汉天地"
              autocomplete="street-address"
              placeholder="例如：武汉天地、汉口江滩、光谷"
            />
            <button type="submit">搜索</button>
          </div>
          <fieldset class="category-group">
            <legend>地点类别</legend>
            <label class="category-option">
              <input type="radio" name="category" value="lawn" checked />
              <span>草坪/江滩</span>
            </label>
            <label class="category-option">
              <input type="radio" name="category" value="park" />
              <span>公园/绿道</span>
            </label>
            <label class="category-option">
              <input type="radio" name="category" value="mall" />
              <span>商场/商圈</span>
            </label>
            <label class="category-option">
              <input type="radio" name="category" value="restaurant" />
              <span>餐饮/咖啡</span>
            </label>
            <label class="category-option">
              <input type="radio" name="category" value="hotel" />
              <span>酒店/住宿</span>
            </label>
            <label class="category-option">
              <input type="radio" name="category" value="pet" />
              <span>宠物服务</span>
            </label>
          </fieldset>
          <fieldset class="radius-group">
            <legend>筛选半径</legend>
            <label><input type="radio" name="radius" value="1" />1 km</label>
            <label><input type="radio" name="radius" value="3" />3 km</label>
            <label><input type="radio" name="radius" value="5" checked />5 km</label>
            <label><input type="radio" name="radius" value="10" />10 km</label>
            <label><input type="radio" name="radius" value="20" />20 km</label>
          </fieldset>
        </form>
      </section>

      <section class="workspace">
        <div class="map-panel" aria-label="武汉地图">
          <div class="map-header">
            <div>
              <p class="section-kicker">地图视图</p>
              <h2 id="result-title">武汉天地附近</h2>
            </div>
            <span class="result-count" id="result-count">0 个地点</span>
          </div>
          <div class="fallback-map" id="map">
            <div class="river river--yangtze"></div>
            <div class="river river--han"></div>
            <div class="map-label map-label--hankou">汉口</div>
            <div class="map-label map-label--wuchang">武昌</div>
            <div class="map-label map-label--hanyang">汉阳</div>
            <div class="origin-marker" id="origin-marker" title="出发点"></div>
            <div class="marker-layer" id="marker-layer"></div>
          </div>
        </div>

        <aside class="results-panel" aria-label="地点列表">
          <div class="results-list" id="results-list"></div>
        </aside>
      </section>
    </main>

    <dialog class="place-dialog" id="place-dialog">
      <button class="dialog-close" id="dialog-close" aria-label="关闭">×</button>
      <img id="dialog-image" alt="" />
      <div class="dialog-body">
        <p class="section-kicker" id="dialog-category"></p>
        <h2 id="dialog-title"></h2>
        <p id="dialog-evidence"></p>
        <dl>
          <div>
            <dt>地址</dt>
            <dd id="dialog-address"></dd>
          </div>
          <div>
            <dt>距离</dt>
            <dd id="dialog-distance"></dd>
          </div>
          <div>
            <dt>电话</dt>
            <dd id="dialog-phone"></dd>
          </div>
          <div>
            <dt>更新时间</dt>
            <dd id="dialog-updated"></dd>
          </div>
        </dl>
        <div class="dialog-actions">
          <a id="dialog-nav" target="_blank" rel="noreferrer">打开导航</a>
          <button id="feedback-button">提交带狗反馈</button>
        </div>
        <form class="feedback-form" id="feedback-form" hidden>
          <h3>真实场景反馈</h3>
          <label>
            到访结果
            <select id="feedback-status" name="status" required>
              <option value="allowed">成功带狗</option>
              <option value="blocked">被阻止</option>
              <option value="outdoor_only">只适合户外/路过</option>
              <option value="uncertain">不确定</option>
            </select>
          </label>
          <label>
            到访日期
            <input id="feedback-date" name="visitDate" type="date" required />
          </label>
          <label>
            现场照片
            <input id="feedback-photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp" required />
          </label>
          <div class="feedback-preview" id="feedback-preview" hidden>
            <img id="feedback-preview-image" alt="反馈照片预览" />
          </div>
          <label>
            备注
            <textarea
              id="feedback-note"
              name="note"
              maxlength="300"
              placeholder="例如：牵绳可进入、只允许户外座位、门口保安不让进等"
            ></textarea>
          </label>
          <p class="feedback-status" id="feedback-status-message"></p>
          <button type="submit">上传反馈</button>
        </form>
      </div>
    </dialog>

    <script src="src/placeLogic.js"></script>
    <script src="src/wuhanPlaces.js"></script>
    <script src="src/imageResolver.js"></script>
    <script src="src/backendConfig.js"></script>
    <script src="src/backendClient.js"></script>
    <script src="src/amapConfig.js"></script>
    <script src="src/amapClient.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
